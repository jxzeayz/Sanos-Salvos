services:

  postgres:
    image: postgis/postgis:15-3.4
    container_name: sanos_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: sanosysalvos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - sanos_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sanos_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - sanos_network

  minio:
    image: minio/minio
    container_name: sanos_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sanos_network

  ms-matching:
    build:
      context: ./ms-matching
    container_name: sanos_ms_matching
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sanosysalvos
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - sanos_network

  ms-notificaciones:
    build:
      context: ./ms-notificaciones
    container_name: sanos_ms_notificaciones
    ports:
      - "8085:8085"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    depends_on:
      - rabbitmq
    networks:
      - sanos_network

  ms-archivos:
    build:
      context: ./ms-archivos
    container_name: sanos_ms_archivos
    ports:
      - "8086:8086"
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin123
      MINIO_BUCKET: mascotas
    depends_on:
      - minio
    networks:
      - sanos_network

  ms-auditoria:
    build:
      context: ./ms-auditoria
    container_name: sanos_ms_auditoria
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sanosysalvos
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin123
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - sanos_network

volumes:
  postgres_data:
  minio_data:

networks:
  sanos_network:
    driver: bridge
