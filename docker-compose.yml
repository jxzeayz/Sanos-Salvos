services:

  postgres:
    image: postgis/postgis:15-3.4
    container_name: sanos_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: sanosysalvos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - sanos_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sanos_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - sanos_network

  minio:
    image: minio/minio
    container_name: sanos_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sanos_network

volumes:
  postgres_data:
  minio_data:

networks:
  sanos_network:
    driver: bridge

